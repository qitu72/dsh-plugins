[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-sync"
version = "0.1.0"
description = "Keep one skill library in sync across many AI agents (Claude Code, Codex, WorkBuddy, CodeBuddy, AutoClaw, ...)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "skill-sync contributors" }]
keywords = ["ai", "agent", "skills", "sync", "claude", "codex", "dotfiles"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

# No runtime dependencies by design: standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
skill-sync = "skill_sync.cli:main"

[tool.setuptools]
packages = ["skill_sync"]

[tool.setuptools.package-data]
skill_sync = []
